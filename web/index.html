<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B0E14">
  <title>HoloSpace Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0B0E14;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Loader mientras Expo carga el bundle */
    #expo-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0E14;
      gap: 16px;
      z-index: 9999;
    }
    #expo-loader .brand {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    #expo-loader .brand span {
      color: #00E676;
    }
    #expo-loader .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0,230,118,0.2);
      border-top-color: #00E676;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    (function() {
      // 1. Si viene con token SSO en los parámetros de la URL, guardarlo inmediatamente
      var urlParams = new URLSearchParams(window.location.search);
      var authToken = urlParams.get('auth_token');
      var authUserStr = urlParams.get('auth_user');
      var authTenantStr = urlParams.get('auth_tenant');

      if (authToken && authUserStr) {
        try {
          localStorage.setItem('hs_token', authToken);
          localStorage.setItem('hs_user', authUserStr);
          if (authTenantStr) localStorage.setItem('hs_tenant', authTenantStr);
          // Limpiar la URL para dejarla limpia
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname);
          }
          return;
        } catch (e) {}
      }

      // 2. Si ya tiene token guardado en localStorage, continuar
      var savedToken = localStorage.getItem('hs_token');
      var savedUser = localStorage.getItem('hs_user');
      if (savedToken && savedUser) {
        return; // Sesión activa, permitir carga de la app
      }

      // 3. Si no tiene sesión, redirigir instantáneamente al Login Oficial Unificado de HoloSpace
      var currentUrl = window.location.href;
      window.location.href = 'https://holospace.com.ar/login?redirect=' + encodeURIComponent(currentUrl);
    })();
  </script>

</head>
<body>
  <div id="expo-loader">
    <div class="brand">HOLO<span>SPACE</span></div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script>
    // Ocultar loader cuando React Native Web monta el root
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const loader = document.getElementById('expo-loader');
        if (loader) loader.style.display = 'none';
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>
</body>
</html>
