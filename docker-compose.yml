services:
  # 1. Servidor de Aplicación HoloWare Core Multi-Tenant
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holoware_app
    restart: unless-stopped
    command: ["node", "--watch", "server.js"]
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HW_PORT=3001
      - DATABASE_URL=postgres://${POSTGRES_USER:-holoware_admin}:${POSTGRES_PASSWORD:-Secr3tP@ssword2026}@postgres:5432/${POSTGRES_DB:-holoware_saas}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-holoware_super_secret_jwt_key_2026_x89f_aes}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./lib:/app/lib
      - ./modules:/app/modules
      - ./package.json:/app/package.json
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - holoware_network

  # 2. Base de Datos Relacional PostgreSQL 16 con Row-Level Security (RLS)
  postgres:
    image: postgres:16-alpine
    container_name: holoware_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-holoware_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Secr3tP@ssword2026}
      POSTGRES_DB: ${POSTGRES_DB:-holoware_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holoware_admin} -d ${POSTGRES_DB:-holoware_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - holoware_network

  # 3. Redis para Caché de Entitlements, Sesiones y Rate-Limiting
  redis:
    image: redis:7-alpine
    container_name: holoware_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - holoware_network

  # 4. Proxy Reverso Nginx con Enrutamiento Multi-Tenant
  nginx:
    image: nginx:alpine
    container_name: holoware_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - holoware_network

  # 5. Servicio de App Móvil ScanBan Scanner (Expo Web & QR Metro Bundler)
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holoware_mobile
    restart: unless-stopped
    command: ["npx", "expo", "start", "--web", "--port", "8081"]
    ports:
      - "8081:8081"
    environment:
      - EXPO_NO_TELEMETRY=1
      - CI=1
    depends_on:
      - app
    networks:
      - holoware_network

  # 6. Servicio Automatizado de Backups Diarios
  backups:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: holoware_backups
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-holoware_saas}
      - POSTGRES_USER=${POSTGRES_USER:-holoware_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Secr3tP@ssword2026}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=30
      - BACKUP_KEEP_WEEKS=12
      - BACKUP_KEEP_MONTHS=12
      - POSTGRES_EXTRA_OPTS=-Z 9
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - holoware_network

volumes:
  postgres_data:
  redis_data:

networks:
  holoware_network:
    driver: bridge
